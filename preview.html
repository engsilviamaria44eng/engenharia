<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obra em Dia — prévia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  /* paleta do engenheiro */
  --pri:#0E7C86;            /* verde-petróleo: cor principal (botões, barras, links) — contraste 4,9:1 com branco */
  --escuro:#06282A;         /* cabeçalho, menu lateral e texto principal */
  --areia:#EEF3F4;          /* fundo das telas */
  --acento:#1EE6F0;         /* ciano vivo: só sobre o fundo escuro (aba ativa, item ativo do menu) */
  --vermelho:#E8845B;       /* coral: atrasado / crítico */
  /* derivadas */
  --pri-forte:#0E7C86;      /* a própria cor principal já tem contraste para texto branco */
  --verm-forte:#A94A28;     /* coral fechado: etiquetas e textos pequenos (contraste 5,6:1 com branco) */
  --ardosia:#3D5A5E;
  --ocre:#F2AD21;           /* amarelo do logo FMZ: atenção */
  --verde:#2F855A;          /* ok */
  --texto:#06282A;
  --texto-2:#3D5A5E;        /* texto secundário: contraste 6,6:1 sobre o fundo */
  --cartao:#FFFFFF;
  --linha:#D3DEE0;
  --fundo-verm:#FBE8E0;
  --fundo-ocre:#FDF0CF;
  --fundo-verde:#E3F1E8;
  --cab-texto:#E6F4F5;
  --cab-texto-2:#9FC3C6;  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --raio:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);font-size:17px;line-height:1.4;color:var(--texto);background:var(--areia);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.mono{font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}

/* ---------- estrutura ---------- */
.app{display:flex;min-height:100vh}
.lateral{display:none}
.principal{flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:84px}

/* ---------- cabeçalho escuro (estilo Painel) ---------- */
.cab{background:var(--escuro);color:var(--cab-texto);padding:14px 16px 0;position:sticky;top:0;z-index:5}
.cab-linha{display:flex;align-items:center;gap:12px}
.cab-marca{width:14px;height:14px;border-radius:3px;background:var(--acento);flex:none}
.cab-obra{flex:1;min-width:0}
.cab-obra b{display:block;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cab-obra span{display:block;font-size:14px;color:var(--cab-texto-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-trocar{min-height:44px;padding:0 14px;border:1px solid #2E5559;border-radius:var(--raio);color:var(--cab-texto);font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.btn-trocar:hover{background:#0F3A3D}
.abas{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
.aba{min-height:44px;padding:0 12px;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--cab-texto-2);border-bottom:3px solid transparent;white-space:nowrap}
.aba.ativa{color:#fff;border-bottom-color:var(--acento)}
.voltar{min-height:44px;min-width:44px;display:flex;align-items:center;gap:6px;color:var(--cab-texto);font-weight:600;font-size:16px;margin-left:-6px;padding:0 6px}

.conteudo{padding:14px 12px 24px;display:flex;flex-direction:column;gap:12px;max-width:1280px;width:100%}

/* ---------- faixa da entrega ---------- */
.faixa{border-radius:var(--raio);padding:12px 14px;display:flex;align-items:center;gap:12px;font-weight:600}
.faixa .ponto{width:12px;height:12px;border-radius:50%;flex:none}
.faixa small{display:block;font-weight:500;font-size:14px;opacity:.95}
.faixa.risco{background:var(--verm-forte);color:#fff}
.faixa.risco .ponto{background:#fff}
.faixa.ok{background:var(--verde);color:#fff}
.faixa.ok .ponto{background:#fff}

/* ---------- cartões de número ---------- */
.numeros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num{background:var(--cartao);border-radius:var(--raio);border-top:4px solid var(--texto-2);padding:10px 10px 12px;box-shadow:0 1px 0 var(--linha)}
.num .rot{font-size:12px;color:var(--texto-2);font-weight:600}
.num .val{font-size:40px;font-weight:700;line-height:1.05;margin-top:2px;font-variant-numeric:tabular-nums}
.num .val small{font-size:16px;font-weight:600;margin-left:2px}
.num .sub{font-size:13px;font-weight:600;margin-top:2px}
.num.verm{border-top-color:var(--vermelho)} .num.verm .val{color:var(--verm-forte)} .num.verm .sub{color:var(--verm-forte)}
.num.ocre{border-top-color:var(--ocre)} .num.ocre .val{color:#8A5A00}
.num.verde{border-top-color:var(--verde)} .num.verde .val{color:var(--verde)}

/* ---------- cartão genérico ---------- */
.cartao{background:var(--cartao);border-radius:var(--raio);box-shadow:0 1px 0 var(--linha)}
.cartao-cab{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--linha);min-height:48px}
.cartao-cab .mono{font-size:13px;font-weight:600;color:var(--texto-2)}
.link{min-height:44px;display:flex;align-items:center;color:var(--pri-forte);font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* ---------- avanço físico ---------- */
.avanco{padding:12px 14px}
.avanco-top{display:flex;justify-content:space-between;align-items:baseline}
.avanco-top b{font-size:28px}
.barra{height:10px;background:#DCE6E8;border-radius:5px;overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:var(--pri);border-radius:5px}

/* ---------- lista de frentes ---------- */
.filtros{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;border-bottom:1px solid var(--linha)}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--linha);font-size:15px;font-weight:600;white-space:nowrap;color:var(--texto-2);background:#fff}
.chip.ativo{background:var(--escuro);border-color:var(--escuro);color:#fff}
.frente{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--linha);text-align:left;width:100%;border-left:5px solid transparent;min-height:64px}
.frente:last-child{border-bottom:0}
.frente:hover{background:#F6FAFA}
.frente.sel{outline:2px solid var(--pri);outline-offset:-2px}
.frente.verm{background:var(--fundo-verm);border-left-color:var(--vermelho)}
.frente.ocre{background:var(--fundo-ocre);border-left-color:var(--ocre)}
.frente.verde{border-left-color:var(--verde)}
.frente .serv{font-size:17px;font-weight:700;line-height:1.25}
.frente .meta{font-size:14px;color:var(--texto-2);grid-column:1}
.frente .linha3{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;margin-top:4px;font-size:15px;color:var(--texto-2)}
.frente .nw{white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.frente .linha3 b{color:var(--texto)}
.mini-barra{width:72px;height:8px;background:#DCE6E8;border-radius:4px;overflow:hidden;flex:none}
.mini-barra i{display:block;height:100%;background:var(--pri)}
.tag{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.04em;padding:6px 10px;border-radius:4px;white-space:nowrap;align-self:start;text-align:center;min-width:84px}
.tag.verm{background:var(--verm-forte);color:#fff}
.tag.ocre{background:var(--ocre);color:var(--escuro)}
.tag.verde{background:var(--fundo-verde);color:var(--verde);border:1px solid #BCD0B5}

/* ---------- rodapé do painel (cartões pequenos) ---------- */
.duplas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.peq{background:var(--cartao);border-radius:var(--raio);padding:10px 12px;box-shadow:0 1px 0 var(--linha)}
.peq .mono{font-size:12px;color:var(--texto-2);font-weight:600}
.peq b{display:block;font-size:17px;margin-top:2px}
.peq.alerta{background:var(--fundo-ocre);border-left:5px solid var(--ocre)}
.peq.alerta b{color:#7A4F00}
.peq.okk{border-left:5px solid var(--verde)}

/* ---------- detalhe ---------- */
.det-titulo{padding:14px}
.det-titulo h2{font-size:22px;line-height:1.2}
.det-titulo p{color:var(--texto-2);font-size:15px;margin-top:4px}
.contas{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--linha);border-top:1px solid var(--linha)}
.conta{background:#fff;padding:10px 14px}
.conta .mono{font-size:12px;color:var(--texto-2);font-weight:600}
.conta b{display:block;font-size:24px;margin-top:2px;font-variant-numeric:tabular-nums}
.conta small{display:block;font-size:13px;color:var(--texto-2)}
.conta.destaque{background:var(--fundo-ocre)}
.conta.destaque b{color:#7A4F00}
.conta.critico{background:var(--fundo-verm)}
.conta.critico b{color:var(--verm-forte)}
.hist{width:100%;border-collapse:collapse;font-size:15px}
.hist th{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--texto-2);text-align:left;padding:8px 14px;font-weight:600}
.hist td{padding:10px 14px;border-top:1px solid var(--linha);font-variant-numeric:tabular-nums}
.hist td.sobe{color:var(--verde);font-weight:600}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px 14px}
.foto{aspect-ratio:1;border-radius:4px;display:flex;align-items:flex-end;padding:6px;font-size:12px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.valores .conta b{font-size:20px}
.so-eng{}
body.mestre .so-eng{display:none !important}

/* ---------- lançar hoje ---------- */
.secao-tit{font-family:var(--mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--texto-2);font-weight:600;margin:4px 2px -4px}
.periodo{padding:10px 10px 4px}
.periodo + .periodo{border-top:1px solid var(--linha)}
.per-rot{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:16px;margin:0 2px 6px}
.per-rot small{font-weight:500;font-size:14px;color:var(--texto-2)}
.climas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-bottom:6px}
.clima{min-height:64px;text-align:center;line-height:1.15;padding:4px 2px;border:2px solid var(--linha);border-radius:var(--raio);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15px;font-weight:600}
.clima svg{width:26px;height:26px}
.clima.ativo{border-color:var(--pri);background:#DDF0F1;color:var(--pri-forte)}
.lf{border-bottom:1px solid var(--linha)}
.lf:last-child{border-bottom:0}
.lf-cab{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:64px;text-align:left}
.caixa{width:28px;height:28px;border:2px solid var(--texto-2);border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center}
.lf.aberta .caixa{background:var(--pri);border-color:var(--pri)}
.lf-cab .serv{font-weight:700;font-size:17px;flex:1}
.lf-cab .serv small{display:block;font-weight:500;font-size:14px;color:var(--texto-2)}
.lf-cab .pct{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.lf-corpo{display:none;padding:0 14px 14px 54px;gap:14px;flex-direction:column}
.lf.aberta .lf-corpo{display:flex}
.campo-rot{font-size:14px;font-weight:600;color:var(--texto-2);margin-bottom:6px}
input[type=range]{width:100%;height:44px;accent-color:var(--pri)}
.stepper{display:flex;align-items:center;gap:0;border:2px solid var(--linha);border-radius:var(--raio);width:max-content;background:#fff}
.stepper button{width:52px;height:48px;font-size:24px;font-weight:700;color:var(--pri-forte)}
.stepper output{min-width:56px;text-align:center;font-size:22px;font-weight:700}
.ef-total{color:var(--texto);font-weight:700}
.ef-grade{display:grid;grid-template-columns:1fr;gap:6px}
.ef-linha{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 4px 4px 12px;border:1px solid var(--linha);border-radius:var(--raio);background:#fff;font-size:16px;font-weight:500}
.ef-linha.tem{border-color:var(--pri);background:#DDF0F1;font-weight:700}
.ef-nova{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--pri-forte);font-weight:600}
.peq-step{border-width:1px}
.peq-step button{width:44px;height:44px;font-size:22px}
.peq-step output{min-width:36px;font-size:19px}
.ef-outra{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.ef-outra input{flex:1;min-width:160px;min-height:52px;border:2px solid var(--linha);border-radius:var(--raio);padding:0 12px;font:inherit;background:#fff;color:var(--texto)}
@media (min-width:600px){ .ef-grade{grid-template-columns:1fr 1fr} }
.marcar{display:flex;align-items:center;gap:12px;min-height:48px;font-weight:600}
.marcar input{width:28px;height:28px;accent-color:var(--verde)}
.btn{min-height:52px;padding:0 18px;border-radius:var(--raio);font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-pri{background:var(--pri-forte);color:#fff}
.btn-pri:hover{background:#0A626A}
.btn-sec{background:#fff;border:2px solid var(--pri-forte);color:var(--pri-forte)}
.btn-bloco{width:100%}
.linha-btns{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px}
.thumbs{display:flex;gap:8px;padding:0 14px 14px;flex-wrap:wrap}
.thumbs .foto{width:84px;height:84px}
.equip{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;border-top:1px solid var(--linha)}
.equip b{font-size:16px}
.equip .q{font-size:20px;font-weight:700;grid-row:1/3;grid-column:2;align-self:center}
.equip span{font-size:14px;color:var(--texto-2)}
.st-ok{color:var(--verde);font-weight:600}
.st-at{color:#8A5A00;font-weight:600}
.st-cr{color:var(--verm-forte);font-weight:600}
textarea{width:100%;min-height:96px;border:2px solid var(--linha);border-radius:var(--raio);padding:12px;font:inherit;background:#fff;color:var(--texto)}
textarea:focus,input:focus{outline:3px solid #7FD3D9;outline-offset:1px}
.salvar-fixo{position:sticky;bottom:84px;padding:10px 0 4px;background:linear-gradient(transparent,var(--areia) 30%)}

/* ---------- estado vazio ---------- */
.vazio{background:#fff;border-radius:var(--raio);padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;border:2px dashed var(--linha)}
.vazio svg{width:72px;height:72px;color:var(--pri)}
.vazio h3{font-size:21px}
.vazio p{color:var(--texto-2);max-width:360px}

/* ---------- barra inferior (celular) ---------- */
.barra-inf{position:fixed;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid var(--linha);display:grid;grid-template-columns:repeat(5,1fr);z-index:10}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:600;color:var(--texto-2);min-height:44px}
.nav-item svg{width:24px;height:24px}
.nav-item.ativo{color:var(--pri-forte);box-shadow:inset 0 3px 0 var(--pri)}
body.mestre .barra-inf{grid-template-columns:repeat(3,1fr)}

/* ---------- folha de troca de obra ---------- */
.veu{position:fixed;inset:0;background:rgba(6,40,42,.55);display:none;z-index:20;align-items:flex-end;justify-content:center}
.veu.aberto{display:flex}
.folha{background:#fff;width:100%;max-width:520px;border-radius:12px 12px 0 0;padding:8px 0 20px}
.folha h3{padding:12px 16px;font-size:18px}
.op-obra{width:100%;text-align:left;padding:12px 16px;min-height:64px;border-top:1px solid var(--linha);display:flex;align-items:center;gap:12px}
.op-obra b{display:block;font-size:17px}
.op-obra span{font-size:14px;color:var(--texto-2)}
.op-obra .tag{margin-left:auto}
.op-obra.atual{background:#DDF0F1}

.aviso{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--escuro);color:#fff;padding:12px 18px;border-radius:var(--raio);font-weight:600;z-index:30;display:none;max-width:calc(100% - 32px);text-align:center}
.aviso.on{display:block}

/* ---------- seletor de perfil (só da prévia) ---------- */
.previa{background:#fff;border:1px dashed var(--texto-2);border-radius:var(--raio);padding:8px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--texto-2)}
.previa button{min-height:40px;padding:0 12px;border-radius:20px;border:1px solid var(--linha);font-weight:600;font-size:14px}
.previa button.ativo{background:var(--pri-forte);color:#fff;border-color:var(--pri-forte)}

/* ---------- orçamento analítico ---------- */
.etapa-cab{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:12px 14px;min-height:56px;background:#F3F7F7;border-bottom:1px solid var(--linha);text-align:left}
.etapa-cab .cod{font-family:var(--mono);font-weight:600;color:var(--pri);font-size:15px}
.etapa-cab b{font-size:16px;text-transform:uppercase;letter-spacing:.02em}
.etapa-cab .tot{font-weight:700;font-variant-numeric:tabular-nums}
.etapa-cab .seta-e{transition:transform .15s;display:inline-block}
.etapa.fechada .seta-e{transform:rotate(-90deg)}
.etapa.fechada .itens{display:none}
.item{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:12px 14px 12px 22px;border-bottom:1px solid var(--linha);text-align:left;min-height:64px}
.item:hover{background:#F6FAFA}
.item .cod{font-family:var(--mono);font-size:14px;color:var(--texto-2);padding-top:2px}
.item .desc{font-size:15.5px;font-weight:600;line-height:1.3}
.item .tot{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.item .q{grid-column:2/4;font-size:14px;color:var(--texto-2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item .q .mini-barra{width:90px}
.comp{width:100%;border-collapse:collapse;font-size:14.5px}
.comp th{font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--texto-2);text-align:left;padding:8px 10px;font-weight:600;background:#F3F7F7}
.comp td{padding:9px 10px;border-top:1px solid var(--linha);vertical-align:top}
.comp td.n,.comp th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.comp tr.tot td{font-weight:700;background:#F3F7F7}
.tipo{display:inline-block;font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.04em;padding:2px 6px;border-radius:3px;text-transform:uppercase}
.tipo.mat{background:#E3EEF7;color:#1F4E79}
.tipo.mo{background:#E3F1E8;color:#22603F}
.tipo.eq{background:#FDF0CF;color:#7A4F00}
.rolar{overflow-x:auto}
.fr-item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;border-top:1px solid var(--linha)}
.fr-item b{font-size:16px}
.fr-item span{font-size:14px;color:var(--texto-2)}
.fr-item .pct{font-size:20px;font-weight:700;grid-row:1/3;grid-column:2;align-self:center}
.numeros.orc{grid-template-columns:1.6fr 1fr 1fr}
.numeros.orc .val{font-size:32px}
.numeros.orc .val.total{font-size:19px;padding-top:8px;white-space:nowrap}
@media (min-width:900px){ .numeros.orc .val{font-size:44px} .numeros.orc .val.total{font-size:30px} }
.importar{display:flex;gap:12px;align-items:center;padding:12px 14px;flex-wrap:wrap}
.importar small{color:var(--texto-2);font-size:14px;flex:1;min-width:200px}

/* ---------- projeto marcado ---------- */
.s1{--c:#2a78d6} .s2{--c:#eb6834} .s3{--c:#1baf7a} .s4{--c:#eda100} .s5{--c:#e87ba4} .s6{--c:#008300}
.prancha-sel{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--linha);align-items:center}

/* ===================== CABEÇALHO ===================== */
function cabecalho(opts={}){
  const o = OBRAS[E.obra];
  const trocar = E.perfil==="eng"
    ? `<button class="btn-trocar" onclick="abrirObras()">Trocar ${I.baixo}</button>` : "";
  const topo = opts.voltar
    ? `<button class="voltar" onclick="ir('${opts.voltar}')">${I.seta} Voltar</button>`
    : `<div class="cab-marca"></div>`;
  return `<header class="cab">
    <div class="cab-linha">${topo}
      <div class="cab-obra"><b>${o.nome}</b><span>${o.cod}</span></div>${trocar}
    </div>
    ${opts.abas ? `<div class="abas">${opts.abas.map((a,i)=>`<button class="aba ${i===0?"ativa":""}">${a}</button>`).join("")}</div>` : `<div style="height:12px"></div>`}
  </header>`;
}

function seletorPrevia(){
  return `<div class="previa">Prévia — ver como:
    <button class="${E.perfil==="eng"?"ativo":""}" onclick="perfil('eng')">Engenheiro</button>
    <button class="${E.perfil==="mes"?"ativo":""}" onclick="perfil('mes')">Mestre</button></div>`;
}

/* ===================== TELA: PAINEL ===================== */
function linhaFrente(f){
  const sem = f.sem===null ? "ainda não começou" : `há <b>${f.sem} ${f.sem===1?"dia":"dias"}</b> sem andar`;
  return `<button class="frente ${f.cls} ${E.frente===f.id?"sel":""}" onclick="abrirFrente('${f.id}')">
    <span class="serv">${f.serv}</span>
    <span class="tag ${f.cls}">${f.tag}</span>
    <span class="meta">${f.amb} · ${f.resp}</span>
    <span class="linha3"><span class="nw"><span class="mini-barra"><i style="width:${f.pct}%"></i></span> <b>${f.pct}%</b></span><span class="nw">${sem}</span><span class="nw">decidir até <b>${f.limite}</b></span></span>
  </button>`;
}

function telaPainel(){
  const o = OBRAS[E.obra];
  if(!o.frentes.length) return cabecalho() + `<div class="conteudo">${seletorPrevia()}
    <div class="vazio">${I.vazio}
      <h3>Esta obra ainda não tem frentes</h3>
      <p>Cadastre as frentes do cronograma (serviço, responsável e datas) e o painel começa a mostrar o que está atrasado.</p>
      <button class="btn btn-pri" onclick="aviso('O formulário de nova frente não faz parte desta prévia')">+ Cadastrar primeira frente</button>
    </div></div>`;

  const lista = `<section class="cartao">
      <div class="cartao-cab"><span class="mono">Frentes · da menor folga para a maior</span><span class="mono">${o.frentes.length}</span></div>
      <div class="filtros"><button class="chip ativo">Todas</button><button class="chip">Por responsável</button><button class="chip">Por ambiente</button></div>
      ${o.frentes.map(linhaFrente).join("")}
    </section>`;

  const lado = DETALHES[E.frente] && o.frentes.some(f=>f.id===E.frente) ? `<div class="painel-lado">${blocoDetalhe(E.frente)}</div>` : `<div class="painel-lado"></div>`;

  return cabecalho({abas:["Hoje","Semana","Equipe"]}) + `<div class="conteudo">
    ${seletorPrevia()}
    <div class="faixa ${o.entrega.risco?"risco":"ok"}"><span class="ponto"></span><div>${o.entrega.titulo}<small>${o.entrega.sub}</small></div></div>
    <div class="numeros">${o.numeros.map(n=>`<div class="num ${n.cls}"><div class="rot mono">${n.rot}</div><div class="val">${n.val}${n.un?`<small>${n.un}</small>`:""}</div><div class="sub">${n.sub}</div></div>`).join("")}</div>
    <div class="painel-grade">
      <div style="display:flex;flex-direction:column;gap:12px">
        <section class="cartao avanco"><div class="avanco-top"><span class="mono" style="font-size:13px;font-weight:600;color:var(--texto-2)">Avanço físico da obra</span><b>${o.avanco}%</b></div><div class="barra"><i style="width:${o.avanco}%"></i></div></section>
        ${lista}
        <div class="duplas">
          <div class="peq ${o.diario.lancado?"okk":"alerta"}"><span class="mono">Diário de hoje</span><b>${o.diario.texto}</b><span style="font-size:14px;color:var(--texto-2)">${o.diario.sub}</span></div>
          <div class="peq"><span class="mono">${o.clima.rot}</span><b style="font-size:15px">${o.clima.txt}</b></div>
        </div>
      </div>
      ${lado}
    </div>
  </div>`;
}

/* ===================== TELA: DETALHE DA FRENTE ===================== */
function blocoDetalhe(id){
  const f = Object.values(OBRAS).flatMap(o=>o.frentes).find(x=>x.id===id);
  const d = DETALHES[id];
  if(!d) return `<section class="cartao det-titulo"><h2>${f.serv}</h2><p>${f.amb} · ${f.resp}</p><p style="margin-top:12px">Nesta prévia, só a <b>Alvenaria 2º pavimento</b> (Jardim Europa) tem o detalhe completo.</p></section>`;
  return `<section class="cartao">
      <div class="det-titulo"><span class="tag ocre" style="float:right">${f.tag}</span><h2>${f.serv}</h2><p>${f.amb} · ${f.resp} · ${d.status}</p><p class="so-eng" style="margin-top:8px"><button class="link" onclick="abrirItem('4.1')">Item 4.1 do orçamento · 630 m² de 1.250 m² →</button></p></div>
      <div class="contas">
        <div class="conta"><span class="mono">Avanço</span><b>${f.pct}%</b></div>
        <div class="conta"><span class="mono">Ritmo</span><b>${d.ritmo}</b><small>${d.ritmoOrig}</small></div>

}

/* ===================== CRONOGRAMA FÍSICO-FINANCEIRO ===================== */
/* previsto: % do valor de cada etapa planejado por mês (vem das datas das frentes);
   realizado: % executado por mês (vem do diário × custo do item). Mês de hoje = out/26 */
const MESES = ["jun/26","jul/26","ago/26","set/26","out/26","nov/26","dez/26","jan/27","fev/27","mar/27"];
const HOJE_M = 4;
const CRON = {
  je:{ "1":{plan:[100], real:[100]},
       "2":{plan:[40,60], real:[40,60]},
       "3":{plan:[0,20,35,30,15], real:[0,15,25,15,3.3]},
       "4":{plan:[0,0,0,30,40,30], real:[0,0,0,35,44.8]},
       "5":{plan:[0,0,0,20,30,30,20], real:[0,0,0,10,15.5]},
       "6":{plan:[0,0,0,0,10,30,30,30], real:[0,0,0,0,14.1]},
       "7":{plan:[0,0,0,0,0,0,0,40,60], real:[0,0,0,0,0]} },
  vn:{ "1":{plan:[0,20,30,30,20], real:[0,20,30,25,10]},
       "2":{plan:[0,0,0,40,60], real:[0,0,0,40,30]},
       "3":{plan:[0,0,0,0,50,50], real:[0,0,0,0,0]} }
};
E.cronModo = "fin";
const CURVA = {W:640,L:40,R:86};

function dadosCron(){
  const o = ORC[E.obra], c = CRON[E.obra];
  if(!o||!c) return null;
  const etapas = o.etapas.map(e=>{
    const tot = e.itens.reduce((a,i)=>a+i.qtd*i.cu,0), d = c[e.cod];
    const plan = MESES.map((_,m)=>d.plan[m]||0), real = MESES.map((_,m)=> m<=HOJE_M ? (d.real[m]||0) : null);
    const prevAc = plan.slice(0,HOJE_M+1).reduce((a,b)=>a+b,0), realAc = real.slice(0,HOJE_M+1).reduce((a,b)=>a+(b||0),0);
    return {...e, tot, plan, real, prevAc, realAc};
  });
  const T = etapas.reduce((a,e)=>a+e.tot,0);
  const prevMes = MESES.map((_,m)=>etapas.reduce((a,e)=>a+e.tot*e.plan[m]/100,0));
  const realMes = MESES.map((_,m)=> m<=HOJE_M ? etapas.reduce((a,e)=>a+e.tot*(e.real[m]||0)/100,0) : null);
  let s=0; const prevAc = prevMes.map(v=>s+=v); s=0; const realAc = realMes.map(v=> v===null?null:(s+=v));
  return {etapas, T, prevMes, realMes, prevAc, realAc};
}

const mil = v => N(v/1000,1);
function situacao(e){
  if(e.prevAc===0 && e.realAc===0) return `<span class="sit ok">A INICIAR</span>`;
  const d = e.realAc - e.prevAc;
  if(d < -5) return `<span class="sit atr">ATRASADA ${N(d,0)} pts</span>`;
  if(d > 5) return `<span class="sit adi">ADIANTADA +${N(d,0)} pts</span>`;
  return `<span class="sit ok">NO PRAZO</span>`;
}

function curvaS(D){
  const estreito = window.innerWidth < 600;
  const W = estreito ? 360 : 640, H = estreito ? 240 : 250, L=40, R = estreito ? 66 : 86, Tp=14, B=30, w=W-L-R, h=H-Tp-B;
  CURVA.W=W; CURVA.L=L; CURVA.R=R;
  const x = m => L + m*(w/(MESES.length-1)), y = p => Tp + h - p/100*h;
  const pp = D.prevAc.map(v=>v/D.T*100), rp = D.realAc.filter(v=>v!==null).map(v=>v/D.T*100);
  const grade = [0,25,50,75,100].map(p=>`<line class="grade" x1="${L}" x2="${W-R}" y1="${y(p)}" y2="${y(p)}"/><text class="eixo" x="${L-6}" y="${y(p)+4}" text-anchor="end">${p}%</text>`).join("");
  const meses = MESES.map((mm,m)=>`<text class="eixo" x="${x(m)}" y="${H-8}" text-anchor="middle">${m===HOJE_M || ((estreito ? m%3===0 : m%2===0) && Math.abs(m-HOJE_M)>1) ? mm : ""}</text>`).join("");
  const linha = (arr,cor,tr) => `<polyline points="${arr.map((p,m)=>`${x(m)},${y(p)}`).join(" ")}" fill="none" stroke="${cor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" ${tr?'stroke-dasharray="6 5"':""}/>`;
  const pontos = (arr,cor) => arr.map((p,m)=>`<circle cx="${x(m)}" cy="${y(p)}" r="4" fill="${cor}" stroke="#fff" stroke-width="2"/>`).join("");
  const ult = rp.length-1;
  return `<div class="legenda"><span class="serie-prev"><i></i>Previsto acumulado</span><span class="serie-real"><i></i>Realizado acumulado</span></div>
  <div class="curva" id="curva">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva S: previsto acumulado ${N(pp[HOJE_M],0)}% e realizado acumulado ${N(rp[ult],0)}% em ${MESES[HOJE_M]}">
      ${grade}${meses}
      <line x1="${x(HOJE_M)}" x2="${x(HOJE_M)}" y1="${Tp}" y2="${Tp+h}" stroke="#06282A" stroke-width="1" stroke-dasharray="2 3"/>
      <text class="eixo" x="${x(HOJE_M)+5}" y="${Tp+10}">HOJE</text>
      ${linha(pp,"#6A55B0",true)}${linha(rp,"#00939E",false)}${pontos(rp,"#00939E")}
      <circle cx="${x(MESES.length-1)}" cy="${y(pp[MESES.length-1])}" r="4" fill="#6A55B0" stroke="#fff" stroke-width="2"/>
      <text class="rot-dir" x="${x(MESES.length-1)+8}" y="${y(pp[MESES.length-1])+4}">Previsto</text>
      <text class="rot-dir" x="${x(ult)+8}" y="${y(rp[ult])+16}">Realizado ${N(rp[ult],0)}%</text>
      <line id="mira" x1="0" x2="0" y1="${Tp}" y2="${Tp+h}" stroke="#3D5A5E" stroke-width="1" style="display:none"/>
      ${MESES.map((_,m)=>`<rect x="${x(m)-w/(MESES.length-1)/2}" y="${Tp}" width="${w/(MESES.length-1)}" height="${h}" fill="transparent" onmouseenter="dicaCurva(${m})" onclick="dicaCurva(${m})"/>`).join("")}
    </svg>
    <div class="dica" id="dica"></div>
  </div>`;
}
function dicaCurva(m){
  const D = dadosCron(), svg = document.querySelector("#curva svg"), dica = document.getElementById("dica"), mira = document.getElementById("mira");
  const {L,R,W} = CURVA, w=W-L-R, xm = L + m*(w/(MESES.length-1));
  mira.setAttribute("x1",xm); mira.setAttribute("x2",xm); mira.style.display="";
  const p = D.prevAc[m]/D.T*100, r = D.realAc[m];
  dica.innerHTML = `<b>${MESES[m]}${m===HOJE_M?" · hoje":""}</b>
    <span class="l serie-prev"><i></i>Previsto ${N(p,1)}% · ${R$(D.prevAc[m])}</span>
    ${r!==null?`<span class="l serie-real"><i></i>Realizado ${N(r/D.T*100,1)}% · ${R$(r)}</span>`:`<span class="l">A realizar ${R$(D.T-D.realAc[HOJE_M])} no total</span>`}`;
  dica.style.display="block";
  const esc = svg.getBoundingClientRect().width/W, px = xm*esc;
  const larg = dica.offsetWidth, cont = document.getElementById("curva").offsetWidth;
  dica.style.left = Math.max(4, Math.min(px - larg/2, cont - larg - 4)) + "px";
  dica.style.top = "8px";
}

      <div class="num"><div class="rot mono">A realizar</div><div class="val total">${R$(D.T-D.realAc[HOJE_M])}</div><div class="sub" style="color:var(--texto-2)">${N(100-D.realAc[HOJE_M]/D.T*100,1)}% da obra</div></div>

      <div class="filtros"><button class="chip ${fin?"ativo":""}" onclick="E.cronModo='fin';manterRolagem(render)">Financeiro (R$)</button><button class="chip ${fin?"":"ativo"}" onclick="E.cronModo='fis';manterRolagem(render)">Físico (%)</button></div>
      <div class="rolar"><table class="crono">
        <thead><tr><th class="fixa">Etapa</th>${MESES.map((m,i)=>`<th class="${i===HOJE_M?"hoje":""}">${m}</th>`).join("")}<th>Total</th><th>Realizado</th><th>A realizar</th><th style="text-align:left">Situação hoje</th></tr></thead>
        <tbody>
        ${D.etapas.map(e=>`
          <tr class="prev"><td class="fixa"><b>${e.cod} ${e.nome}</b><span class="tp">previsto</span></td>${e.plan.map((v,i)=>`<td class="${i===HOJE_M?"hoje":""}">${cel(v,e.tot)}</td>`).join("")}
            <td rowspan="2">${fin?mil(e.tot):"100%"}</td><td rowspan="2"><b>${fin?mil(e.tot*e.realAc/100):N(e.realAc,0)+"%"}</b></td><td rowspan="2">${fin?mil(e.tot*(100-e.realAc)/100):N(100-e.realAc,0)+"%"}</td><td rowspan="2" style="text-align:left">${situacao(e)}</td></tr>

const dm = s => { const [d,m]=s.split("/").map(Number); return m*100+d; };
function medidaMarca(m){
  if(m.t==="linha"){ let L=0; for(let i=1;i<m.pts.length;i++){ const [a,b]=m.pts[i-1],[c,d]=m.pts[i]; L+=Math.hypot(c-a,d-b); } return `${N(L/PX_M,2)} m`; }
  let A=0; for(let i=0;i<m.pts.length;i++){ const [a,b]=m.pts[i],[c,d]=m.pts[(i+1)%m.pts.length]; A+=a*d-c*b; } return `${N(Math.abs(A)/2/(PX_M*PX_M),2)} m²`;
}
function servDe(id){ return SERVS.find(s=>s.id===id); }

function svgMarca(m){
  const s = servDe(m.s), pts = m.pts.map(p=>p.join(",")).join(" ");
  const [lx,ly] = m.t==="area" ? [m.pts.reduce((a,p)=>a+p[0],0)/m.pts.length, m.pts.reduce((a,p)=>a+p[1],0)/m.pts.length] : m.pts[Math.floor((m.pts.length-1)/2)];
  const forma = m.t==="area"
    ? `<polygon points="${pts}" fill="${s.cor}" fill-opacity=".28" stroke="${s.cor}" stroke-width="2"/>`
    : `<polyline points="${pts}" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${pts}" fill="none" stroke="${s.cor}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" ${m.s==="ins"?'stroke-dasharray="10 6"':""}/>`;
  return `<g><title>${s.nome} · ${medidaMarca(m)} · executado em ${m.d}/2026 · ${m.q}</title>${forma}
    <text class="mk-rot" x="${lx+6}" y="${ly-6}">${s.nome.split(" (")[0]} · ${m.d}</text></g>`;
}

function cliquePlanta(ev){
  if(!MK.modo) return;
  const svg = document.getElementById("planta"), pt = svg.createSVGPoint();
  pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  MK.pts.push([Math.round(p.x), Math.round(p.y)]);
  manterRolagem(render);
}
function concluirMarca(){
  const s = servDe(MK.serv), min = s.tipo==="area" ? 3 : 2;
  if(MK.pts.length < min){ aviso(`Marque pelo menos ${min} pontos`); return; }
  const m = {p:MK.prancha, s:MK.serv, t:s.tipo, pts:MK.pts, d:"18/10", q:"Engenheiro"};
  MK.marcas.push(m); MK.pts=[]; MK.modo=null; MK.ate="18/10"; MK.ocultos[s.id]=false;
  manterRolagem(render); aviso(`${s.nome}: ${medidaMarca(m)} marcados como executados hoje`);
}

        <button class="btn-pdf" onclick="abrirPdf(${i})" aria-label="Gerar PDF do diário de ${x.d}">PDF</button>
        <span class="info">RDO nº ${x.n} · Clima ${climaTxt(x.clima)}<br>${x.fr} frentes · ${x.ef} pessoas · ${x.fotos} fotos${eng && x.nlib ? ` · <span class="nlib">${x.nlib} não liberadas ao cliente</span>`:""}</span>
      </div>`).join("")}
    </section></div>`;
}

function abrirPdf(i){
  PDF.dia=i; PDF.modo="dia"; desenharFolhaPdf();
  document.getElementById("veuPdf").classList.add("aberto");
}
function fecharPdf(){ document.getElementById("veuPdf").classList.remove("aberto"); }
function desenharFolhaPdf(){
  const dias = DIAS[E.obra];
  const ops = dias.map((x,i)=>`<option value="${i}">${x.d}</option>`).join("");
  document.getElementById("folhaPdf").innerHTML = `
    <h3>Gerar PDF do diário</h3>
    <label class="opcao"><input type="radio" name="modo" ${PDF.modo==="dia"?"checked":""} onchange="PDF.modo='dia';desenharFolhaPdf()"> Só o dia ${dias[PDF.dia].d}</label>
    <label class="opcao"><input type="radio" name="modo" ${PDF.modo==="per"?"checked":""} onchange="PDF.modo='per';desenharFolhaPdf()"> Um período (uma página por dia)</label>
    ${PDF.modo==="per" ? `<div class="periodo-datas">
      <label>De<select onchange="PDF.de=+this.value">${ops.replace(`value="${PDF.de}"`,`value="${PDF.de}" selected`)}</select></label>
      <label>Até<select onchange="PDF.ate=+this.value">${ops.replace(`value="${PDF.ate}"`,`value="${PDF.ate}" selected`)}</select></label>
    </div>` : ""}
    <label class="opcao"><input type="checkbox" ${PDF.fotos?"checked":""} onchange="PDF.fotos=this.checked"> Incluir as fotos do dia</label>
    <div class="linha-btns"><button class="btn btn-sec" onclick="fecharPdf()">Cancelar</button><button class="btn btn-pri" style="flex:1" onclick="verPdf()">Ver o PDF</button></div>`;
}
function verPdf(){
  const dias = DIAS[E.obra];
  if(PDF.modo==="dia") PDF.dias=[PDF.dia];
  else { const a=Math.min(PDF.de,PDF.ate), b=Math.max(PDF.de,PDF.ate); PDF.dias=[]; for(let i=b;i>=a;i--) PDF.dias.push(i); }
  fecharPdf(); E.tela="rdo"; render(); window.scrollTo(0,0);
}

function papelRdo(x){
  const o = OBRAS[E.obra], logo = document.querySelector("#lateral img")?.src || "";
  const efetivo = [["Pedreiro",4],["Servente",4],["Eletricista",1],["Carpinteiro",2]];
  const total = efetivo.reduce((a,b)=>a+b[1],0);
  const servicos = E.obra==="je" ? [
      ["Alvenaria 2º pavimento","Suíte 1","Silva Alvenarias","+4%","60%","2 pedreiros · 2 serventes"],
      ["Instalações elétricas — tubulação","Sala","Elétrica Luz Forte","+3%","25%","1 eletricista · 1 servente"],
      ["Reboco interno","Cozinha","Equipe própria","+5%","10%","2 pedreiros · 1 servente"]]
    : [["Alvenaria","Pavimento superior","Silva Alvenarias","+5%","85%","2 pedreiros · 2 serventes"],
       ["Contrapiso","Térreo","Equipe própria","+10%","70%","2 pedreiros · 2 serventes"]];
  const equip = [["Betoneira 400 L",1,"Alugado","Em uso"],["Andaime (módulos)",20,"Próprio","Em uso"],["Serra mármore",1,"Próprio","Com defeito"]];
  return `<article class="papel">
    <div class="rdo-topo"><img src="${logo}" alt="FMZ Incorporadora"><div><h1>RELATÓRIO DIÁRIO DE OBRA</h1><div style="color:#555">${o.nome}</div></div>
      <div class="num-rdo">RDO Nº<b>${x.n}</b>${x.d}</div></div>
    <div class="rdo-dados">
      <div><span>Obra:</span> ${o.nome}</div><div><span>Data:</span> ${x.d} (${x.sem})</div>
      <div><span>Cliente:</span> ${o.cod.split("·")[0].replace("Cliente:","").trim()}</div><div><span>Entrega em contrato:</span> ${o.cod.split("entrega")[1].trim()}</div>
      <div><span>Lançado por:</span> ${x.autor}, às ${x.hora}</div><div><span>Responsável técnico:</span> Engenheiro responsável</div>
    </div>
    <h2>Condições do tempo</h2>
    <table><tr><th>Manhã</th><th>Tarde</th><th>Noite</th></tr><tr>${x.clima.map(c=>`<td>${c||"Não informado"}</td>`).join("")}</tr></table>
    <h2>Mão de obra (efetivo)</h2>
    <table><tr><th>Função</th><th class="n">Quantidade</th></tr>${efetivo.map(e=>`<tr><td>${e[0]}</td><td class="n">${e[1]}</td></tr>`).join("")}<tr><th>Total</th><th class="n">${total}</th></tr></table>
    <h2>Serviços executados</h2>
    <table><tr><th>Frente de serviço</th><th>Ambiente</th><th>Responsável</th><th class="n">No dia</th><th class="n">Acumulado</th><th>Equipe</th></tr>
      ${servicos.map(s=>`<tr><td>${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td><td class="n">${s[3]}</td><td class="n">${s[4]}</td><td>${s[5]}</td></tr>`).join("")}</table>
    <h2>Ferramentas e equipamentos</h2>
    <table><tr><th>Equipamento</th><th class="n">Qtd.</th><th>Origem</th><th>Situação</th></tr>${equip.map(e=>`<tr><td>${e[0]}</td><td class="n">${e[1]}</td><td>${e[2]}</td><td>${e[3]}</td></tr>`).join("")}</table>
    <h2>Ocorrências</h2>
    <p>Faltou bloco cerâmico de manhã. A entrega chegou às 10h e a alvenaria retomou depois do almoço. Chuva a partir das 15h interrompeu o reboco externo.</p>
    ${PDF.fotos ? `<h2>Registro fotográfico</h2><div class="rdo-fotos">
      ${[["Suíte 1 — alvenaria","#4F7A7E"],["Sala — tubulação elétrica","#6A8F92"],["Cozinha — reboco","#466A6E"],["Fachada — vista geral","#7FA0A3"]].map(p=>`<figure><div class="foto" style="background:linear-gradient(135deg,${p[1]},#0F3A3D)">foto</div><figcaption>${p[0]} · ${x.d}</figcaption></figure>`).join("")}
    </div>` : ""}
    <div class="assin"><div>${x.autor}<br>Mestre de obras</div><div>Engenheiro responsável<br>Responsável técnico</div></div>
    <div class="rdo-rodape"><span>Gerado pelo Obra em Dia · FMZ Incorporadora</span><span>18/10/2026, 08h12</span></div>
  </article>`;
}

function telaRdo(){
  const dias = DIAS[E.obra];
  const txt = PDF.dias.length===1 ? `RDO de ${dias[PDF.dias[0]].d}` : `${PDF.dias.length} RDOs · ${dias[PDF.dias[0]].d} a ${dias[PDF.dias[PDF.dias.length-1]].d}`;
  return cabecalho({voltar:"diario"}) + `<div class="conteudo" style="max-width:900px">
    <div class="rdo-barra"><button class="btn btn-pri" onclick="window.print()">Salvar em PDF</button><span style="color:var(--texto-2);font-size:15px">${txt}. No celular, escolha "Salvar como PDF" na tela de impressão.</span></div>
    <div class="rdo-fundo">${PDF.dias.map(i=>papelRdo(dias[i])).join("")}</div>
  </div>`;
}

/* ===================== NAVEGAÇÃO ===================== */
function ir(t){
  if(t==="frentes" && E.perfil==="mes"){ E.tela="lista-mestre"; }
  else E.tela=t;
  render(); window.scrollTo(0,0);
}
function abrirFrente(id){
  E.frente=id;
  if(window.innerWidth>=1200 && E.tela==="painel"){ render(); return; }
  E.tela="detalhe"; render(); window.scrollTo(0,0);
}
function perfil(p){
  E.perfil=p; document.body.classList.toggle("mestre",p==="mes");
  if(p==="mes"){ E.obra="je"; E.tela="hoje"; } else { E.tela="painel"; }
  render();
}
function telaListaMestre(){
  const o = OBRAS.je;
  return cabecalho() + `<div class="conteudo">${seletorPrevia()}
    <section class="cartao"><div class="cartao-cab"><span class="mono">Frentes da obra · sem valores</span></div>
    ${o.frentes.map(linhaFrente).join("")}</section></div>`;
}

function render(){
  menu();
  const T = {
    painel:telaPainel, detalhe:telaDetalhe, hoje:telaHoje, "lista-mestre":telaListaMestre,
    diario:telaDiario, rdo:telaRdo,
    orcamento:telaOrcamento, item:telaItem, "frentes-eng":telaFrentesEng, cronograma:telaCronograma, calculadora:telaCalculadora, projeto:telaProjeto,
    medicao:()=>telaFora("Medição"), obras:()=>telaFora("Obras e equipe")
  };
  document.getElementById("principal").innerHTML = (T[E.tela]||telaPainel)();
}

/* ===================== AÇÕES ===================== */
function abrirObras(){
  document.getElementById("listaObras").innerHTML = Object.entries(OBRAS).map(([k,o])=>{
    const t = !o.frentes.length ? `<span class="tag" style="background:#DCE6E8">NOVA</span>` : o.entrega.risco ? `<span class="tag verm">EM RISCO</span>` : `<span class="tag verde">DE PÉ</span>`;
    return `<button class="op-obra ${k===E.obra?"atual":""}" onclick="trocarObra('${k}')"><div><b>${o.nome}</b><span>${o.cod}</span></div>${t}</button>`;
  }).join("");
  document.getElementById("veu").classList.add("aberto");
}
function fecharObras(){ document.getElementById("veu").classList.remove("aberto"); }
function trocarObra(k){
  E.obra=k; E.frente = OBRAS[k].frentes[0]?.id || null;
  if(k==="je") E.frente="alv";
  if(E.tela!=="painel") E.tela="painel";
  fecharObras(); render(); window.scrollTo(0,0);
}
function alternar(id){ E.abertas[id]=!E.abertas[id]; render(); }
function previaAvanco(id,v){ E.valores[id]=+v; document.getElementById("pct-"+id).textContent=v+"%"; }
function mudarAvanco(id,v){ E.valores[id]=+v; render(); }
function totalEf(ef){ return Object.values(ef).reduce((a,b)=>a+b,0); }
function efetivo(id,fn,d){ const ef=E.efetivo[id]; ef[fn]=Math.max(0,(ef[fn]||0)+d); if(!ef[fn]) delete ef[fn]; manterRolagem(render); }
function outraFuncao(id){
  const campo=document.getElementById("outra-"+id), nome=campo.value.trim().replace(/\s+/g," ");
  if(!nome){ campo.focus(); return; }
  const fn = nome.charAt(0).toUpperCase()+nome.slice(1);
  const existe = [...FUNCOES,...E.outras].find(x=>x.toLowerCase()===fn.toLowerCase());
  if(!existe) E.outras.push(fn);
  const alvo = existe||fn; E.efetivo[id][alvo]=(E.efetivo[id][alvo]||0)+1;
  manterRolagem(render); aviso(existe?`${alvo} já estava na lista: +1`:`${fn} acrescentado à lista`);
}
function manterRolagem(fn){ const y=window.scrollY; fn(); window.scrollTo(0,y); }
function concluir(id,c){ E.valores[id]= c?100:FR_HOJE.find(f=>f.id===id).ult; render(); }
let tAviso;
function aviso(txt){ const a=document.getElementById("aviso"); a.textContent=txt; a.classList.add("on"); clearTimeout(tAviso); tAviso=setTimeout(()=>a.classList.remove("on"),2400); }

let estreitoAntes = window.innerWidth<600;
window.addEventListener("resize",()=>{ const e=window.innerWidth<600; if(e!==estreitoAntes){ estreitoAntes=e; if(E.tela==="cronograma") manterRolagem(render); }});
let largoAntes = window.innerWidth>=1200;
window.addEventListener("resize",()=>{ const l=window.innerWidth>=1200; if(l!==largoAntes){ largoAntes=l; if(l && E.tela==="detalhe"){E.tela="painel";} render(); }});

render();
</script>
</body>
</html>
